<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookList — Student Reading Tracker</title>
<style>
  

  :root {
    --blue-deep:   #2B4C8C;
    --blue-mid:    #4A6FA5;
    --blue-light:  #7FA3D1;
    --blue-ghost:  #E8EFF8;
    --green-act:   #3BAF7A;
    --green-light: #D4F0E4;
    --amber:       #F0A500;
    --amber-light: #FFF3CD;
    --red:         #D94F4F;
    --red-light:   #FDEAEA;
    --purple:      #7b4cc0;
    --gray-900:    #1A1A2E;
    --gray-700:    #3D4460;
    --gray-500:    #6B7280;
    --gray-300:    #C8D0DC;
    --gray-100:    #F4F6FA;
    --white:       #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #EAECF2; color: #1A1A2E; font-size: 13px; }

  /* ══ HEADER ══ */
  .header {
    background: #2B4C8C; height: 56px;
    display: flex; align-items: center; padding: 0 28px; gap: 0;
    position: sticky; top: 0; z-index: 200;
    box-shadow: 0 2px 12px rgba(43,76,140,.35);
  }
  .logo { font-size: 18px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 9px; margin-right: 24px; text-decoration: none; }
  .logo-icon { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 17px; }

  /* MENU BAR */
  .menu-items { display: flex; height: 56px; }
  .menu-item { position: relative; }
  .menu-item > button { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.7); padding: 0 15px; height: 56px; border: none; background: none; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all .12s; }
  .menu-item > button:hover, .menu-item.open > button { background: rgba(255,255,255,0.12); color: #fff; }
  .drop-menu { display: none; position: absolute; top: 56px; left: 0; background: #FFFFFF; border: 1.5px solid #C8D0DC; border-radius: 9px; box-shadow: 0 8px 28px rgba(0,0,0,0.15); min-width: 200px; padding: 5px 0; z-index: 500; }
  .menu-item.open .drop-menu { display: block; }
  .drop-item { display: flex; align-items: center; gap: 10px; padding: 9px 16px; font-size: 12.5px; color: #3D4460; cursor: pointer; }
  .drop-item:hover { background: #E8EFF8; color: #2B4C8C; }
  .drop-item .ks { margin-left: auto; font-size: 10px; color: #C8D0DC; font-family: monospace; background: #F4F6FA; padding: 1px 5px; border-radius: 3px; }
  .drop-item.danger { color: #D94F4F; }
  .drop-item.danger:hover { background: #FDEAEA; }
  .drop-sep { height: 1px; background: #C8D0DC; margin: 4px 0; }

  /* NAV TABS */
  .nav-tabs { display: flex; gap: 3px; margin-left: auto; }
  .nav-tab { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.65); padding: 7px 16px; border-radius: 7px; border: none; background: none; cursor: pointer; transition: all .12s; }
  .nav-tab:hover { color: #fff; background: rgba(255,255,255,0.1); }
  .nav-tab.active { background: rgba(255,255,255,0.2); color: #fff; font-weight: 700; }

  /* TOOLBAR */
  .toolbar { background: #FFFFFF; border-bottom: 1.5px solid #C8D0DC; padding: 7px 24px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tb-btn { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 600; color: #3D4460; background: #F4F6FA; border: 1.5px solid #C8D0DC; border-radius: 6px; padding: 5px 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all .12s; white-space: nowrap; }
  .tb-btn:hover { background: #E8EFF8; border-color: #4A6FA5; color: #2B4C8C; }
  .tb-btn.on { background: #4A6FA5; border-color: #4A6FA5; color: #fff; }
  .tb-sep { width: 1px; height: 22px; background: #C8D0DC; margin: 0 3px; }
  .prog-wrap { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .prog-label { font-size: 11px; color: #6B7280; }
  .prog-track { width: 90px; height: 6px; background: #C8D0DC; border-radius: 3px; overflow: hidden; }
  .prog-fill  { height: 100%; background: #3BAF7A; border-radius: 3px; transition: width .4s; }

  /* PAGES */
  .page { max-width: 1160px; margin: 0 auto; padding: 22px 20px 60px; display: none; }
  .page.active { display: block; }

  /* CONTEXT MENU */
  .ctx { display: none; position: fixed; background: #FFFFFF; border: 1.5px solid #C8D0DC; border-radius: 9px; box-shadow: 0 8px 24px rgba(0,0,0,0.16); padding: 5px 0; min-width: 185px; z-index: 800; }
  .ctx.open { display: block; }
  .ctx-item { display: flex; align-items: center; gap: 9px; padding: 8px 14px; font-size: 12.5px; color: #3D4460; cursor: pointer; }
  .ctx-item:hover { background: #E8EFF8; color: #2B4C8C; }
  .ctx-item.danger { color: #D94F4F; }
  .ctx-item.danger:hover { background: #FDEAEA; }
  .ctx-sep { height: 1px; background: #C8D0DC; margin: 4px 0; }

  /* MODAL */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.38); z-index: 600; align-items: center; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: #FFFFFF; border-radius: 12px; padding: 26px; max-width: 360px; width: 92%; box-shadow: 0 12px 48px rgba(0,0,0,.22); animation: mIn .18s ease; }
  @keyframes mIn { from { transform:scale(.93);opacity:0; } to { transform:scale(1);opacity:1; } }
  .modal h3 { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .modal p  { font-size: 12.5px; color: #6B7280; line-height: 1.6; margin-bottom: 20px; }
  .modal-btns { display: flex; gap: 9px; justify-content: flex-end; }

  /* TOAST */
  .toast-wrap { position: fixed; bottom: 18px; right: 18px; z-index: 999; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  .toast { background: #1A1A2E; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; opacity: 0; transform: translateY(8px); transition: all .2s; max-width: 300px; }
  .toast.show { opacity: 1; transform: translateY(0); }
