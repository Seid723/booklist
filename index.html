<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookList — Student Reading Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#EAECF2;color:#1A1A2E;font-size:13px;min-height:100vh;}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh;}
.screen.active{display:flex;}

/* ── AUTH SCREENS (login/register) ── */
.auth-screen{align-items:center;justify-content:center;background:linear-gradient(135deg,#2B4C8C 0%,#4A6FA5 50%,#3BAF7A 100%);padding:20px;}
.auth-box{background:#fff;border-radius:16px;padding:36px 32px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.auth-logo{text-align:center;margin-bottom:24px;}
.auth-logo .icon{font-size:44px;margin-bottom:8px;}
.auth-logo h1{font-size:22px;font-weight:700;color:#2B4C8C;}
.auth-logo p{font-size:12px;color:#6B7280;margin-top:3px;}
.auth-title{font-size:16px;font-weight:700;color:#1A1A2E;margin-bottom:4px;}
.auth-sub{font-size:12px;color:#6B7280;margin-bottom:22px;}
.form-group{margin-bottom:14px;}
.lbl{font-size:11.5px;font-weight:600;color:#3D4460;display:block;margin-bottom:5px;}
.inp{font-family:'DM Sans',sans-serif;font-size:13px;border:1.5px solid #C8D0DC;border-radius:8px;padding:10px 13px;width:100%;background:#fff;color:#1A1A2E;transition:border-color .15s,box-shadow .15s;}
.inp:focus{outline:none;border-color:#4A6FA5;box-shadow:0 0 0 3px rgba(74,111,165,.13);}
.inp::placeholder{color:#C8D0DC;}
.inp.err{border-color:#D94F4F;background:#fff8f8;}
.pw-wrap{position:relative;}
.pw-wrap .inp{padding-right:40px;}
.pw-eye{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:15px;color:#6B7280;}
.err-msg{font-size:10.5px;color:#D94F4F;margin-top:4px;display:none;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;border:none;border-radius:8px;font-size:13px;padding:11px 20px;transition:all .15s;width:100%;}
.btn:active{transform:scale(.98);}
.btn-primary{background:#2B4C8C;color:#fff;}
.btn-primary:hover{background:#1e3566;}
.btn-ghost{background:#F4F6FA;color:#3D4460;border:1.5px solid #C8D0DC;}
.btn-ghost:hover{background:#E8EFF8;}
.auth-link{text-align:center;margin-top:18px;font-size:12.5px;color:#6B7280;}
.auth-link a{color:#4A6FA5;font-weight:600;text-decoration:none;cursor:pointer;}
.auth-link a:hover{text-decoration:underline;}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#C8D0DC;}
.divider span{font-size:11px;color:#6B7280;}

/* ── APP SCREEN ── */
.app-screen{flex-direction:column;background:#EAECF2;}

/* HEADER */
.header{background:#2B4C8C;height:56px;display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(43,76,140,.3);}
.logo{font-size:17px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px;}
.logo-icon{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:16px;}
.nav-tabs{display:flex;gap:3px;margin-left:auto;}
.nav-tab{font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.65);padding:6px 14px;border-radius:6px;border:none;background:none;cursor:pointer;transition:all .15s;}
.nav-tab:hover{color:#fff;background:rgba(255,255,255,.1);}
.nav-tab.active{background:rgba(255,255,255,.2);color:#fff;font-weight:700;}
.user-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:none;border-radius:20px;padding:5px 12px 5px 6px;cursor:pointer;color:#fff;font-family:'DM Sans',sans-serif;font-size:12.5px;transition:background .15s;}
.user-btn:hover{background:rgba(255,255,255,.2);}
.user-avatar{width:26px;height:26px;border-radius:50%;background:#4A6FA5;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}

/* PAGES */
.page{max-width:1100px;margin:0 auto;padding:22px 20px 60px;display:none;width:100%;}
.page.active{display:block;}
.page-title{font-size:22px;font-weight:700;color:#2B4C8C;margin-bottom:4px;}
.page-sub{font-size:12px;color:#6B7280;margin-bottom:20px;}

/* CARDS */
.card{background:#fff;border:1.5px solid #C8D0DC;border-radius:12px;overflow:hidden;}
.card-head{background:#4A6FA5;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;}
.card-head h2{font-size:13px;font-weight:700;color:#fff;}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;}
.tbl thead tr{background:#2B4C8C;}
.tbl thead th{font-size:11px;font-weight:700;color:#fff;padding:10px 12px;text-align:left;cursor:pointer;}
.tbl thead th:hover{background:rgba(255,255,255,.08);}
.tbl tbody tr{border-bottom:1px solid #EEF1F6;cursor:pointer;transition:background .1s;}
.tbl tbody tr:nth-child(even){background:#F4F6FA;}
.tbl tbody tr:nth-child(odd){background:#fff;}
.tbl tbody tr:hover{background:#E8EFF8!important;}
.tbl tbody tr.selected{background:#d9e8f6!important;border-left:3px solid #4A6FA5;}
.tbl td{font-size:12.5px;padding:9px 12px;color:#3D4460;vertical-align:middle;}
.tbl td:first-child{font-weight:600;color:#1A1A2E;}
.tbl tfoot td{background:#F4F6FA;font-size:11px;color:#6B7280;padding:8px 14px;border-top:1px solid #C8D0DC;}

/* BADGES */
.badge{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;}
.badge-read{background:#D4F0E4;color:#1d6b47;cursor:pointer;}
.badge-toread{background:#FFF3CD;color:#7a5c00;cursor:pointer;}
.badge-fiction{background:#e8eeff;color:#3d4cc0;}
.badge-scifi{background:#eef4ff;color:#2563b0;}
.badge-nonfic{background:#f0e8ff;color:#6b35c0;}
.badge-dystopia{background:#fff0e8;color:#c05a20;}
.badge-mystery{background:#e8fff2;color:#1d6b47;}
.badge-fantasy{background:#fde8ff;color:#8b00c0;}

/* BUTTONS (inline) */
.ibtn{display:inline-flex;align-items:center;gap:5px;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;border:none;border-radius:7px;font-size:12px;padding:6px 13px;transition:all .15s;white-space:nowrap;}
